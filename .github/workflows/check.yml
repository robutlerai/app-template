name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/check.mjs
      - name: Syntax of every module
        run: for f in app/*.js; do node --check --input-type=module < "$f"; done
